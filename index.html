<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Confetti Buttons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #191919;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            z-index: 100; /* Keeps buttons in front of the confetti */
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative; /* Anchor point for positioning calculations */
        }

        button:active {
            transform: scale(0.95);
        }

        /* Rainbow styled buttons */
        #btn1 { background: linear-gradient(45deg, #ff4757, #ffa502); }
        #btn1:hover { filter: brightness(1.1); }
        #btn2 { background: linear-gradient(45deg, #2ed573, #1e90ff); }
        #btn2:hover { filter: brightness(1.1); }

        /* The individual confetti items */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 50; /* Sits behind the container (100) but above the background */
            will-change: transform, opacity;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translate3d(var(--x2), var(--y2), 0) rotate3d(1, 1, 1, var(--r2));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="btn1">Pop Blast!</button>
        <button id="btn2">Synth Burst!</button>
    </div>

    <script>
        const rainbowColors = ['#ff4757', '#ffa502', '#eccc68', '#2ed573', '#1e90ff', '#70a1ff', '#9b59b6'];

        function spawnConfetti(count, buttonElement, baseAngle, spread) {
            // Get the precise pixel boundaries and center point of the clicked button
            const rect = buttonElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';

                // Size metrics (Large festival style ribbons)
                const width = Math.random() * 12 + 15;
                const height = Math.random() * 20 + 25;
                piece.style.width = `${width}px`;
                piece.style.height = `${height}px`;
                
                // Color assignment
                piece.style.backgroundColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];

                // Center the confetti origins right behind the middle of the button
                piece.style.left = `${startX - width / 2}px`;
                piece.style.top = `${startY - height / 2}px`;

                // Physics angles and distance calculations
                const angleRad = (baseAngle + (Math.random() * spread - spread / 2)) * (Math.PI / 180);
                const distance = Math.random() * 300 + 150; // Throw velocity distance
                
                // End trajectory positions
                const endX = Math.cos(angleRad) * distance;
                const endY = -Math.sin(angleRad) * distance + 400; // Gravity simulation pull downward
                const endRotation = Math.random() * 720 + 360;

                // Pass custom CSS variables directly into the keyframe animation
                piece.style.setProperty('--x2', `${endX}px`);
                piece.style.setProperty('--y2', `${endY}px`);
                piece.style.setProperty('--r2', `${endRotation}deg`);

                // Set random rotation starting angle
                piece.style.transform = `rotate3d(1, 1, 1, ${Math.random() * 360}deg)`;

                // Dynamic durations so they fall at natural, variable speeds
                const duration = Math.random() * 1.2 + 1.2;
                piece.style.animationDuration = `${duration}s`;

                document.body.appendChild(piece);

                // Auto-cleanup node memory after animation ends
                setTimeout(() => {
                    piece.remove();
                }, duration * 1000);
            }
        }

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSynthSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- TRIGGER BUTTON ACTIONS ---
        document.getElementById('btn1').addEventListener('click', function() {
            playPopSound();
            // Shoots 360 degrees outwards from behind this specific button
            spawnConfetti(60, this, 90, 360);
        });

        document.getElementById('btn2').addEventListener('click', function() {
            playSynthSound();
            // Shoots 360 degrees outwards from behind this specific button
            spawnConfetti(60, this, 90, 360);
        });
    </script>

</body>
</html>
