<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Confetti Explosion</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #191919;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 120px; /* Increased from 40px to 120px to space them out significantly */
            z-index: 100;
        }

        button {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            color: #191919;
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            position: relative;
            font-family: "Times New Roman", Times, serif; 
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            background-color: #e5e5e5;
        }

        /* Confetti pieces shooting outward */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            will-change: transform, opacity;
            animation: explode linear forwards;
        }

        @keyframes explode {
            0% {
                transform: translate3d(0, 0, 0) scale(0.3) rotate3d(1, 1, 1, 0deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate3d(var(--x2), var(--y2), 0) scale(1) rotate3d(1, 1, 1, var(--r2));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="btn1">Procrastinating .ᐟ.ᐟ</button>
        <button id="btn2">Locked In .ᐟ.ᐟ</button>
    </div>

    <script>
        const greenColors = [
            '#2ed573', // Bright Lime Green
            '#7bed9f', // Soft Light Green
            '#1dd1a1', // Minty Light Green
            '#10ac84', // Deep Emerald Green
            '#05441a', // Forest Dark Green
            '#0f6b2d'  // Mid Dark Green
        ];

        function explodeConfetti(buttonElement, count) {
            const rect = buttonElement.getBoundingClientRect();
            
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';

                const width = Math.random() * 12 + 16;
                const height = Math.random() * 20 + 26;
                piece.style.width = `${width}px`;
                piece.style.height = `${height}px`;
                
                piece.style.backgroundColor = greenColors[Math.floor(Math.random() * greenColors.length)];

                piece.style.left = `${centerX - width / 2}px`;
                piece.style.top = `${centerY - height / 2}px`;

                const angleRad = (i * (360 / count) + (Math.random() * 15 - 7.5)) * (Math.PI / 180);
                const blastDistance = Math.random() * 250 + 150; 
                
                const endX = Math.cos(angleRad) * blastDistance;
                const endY = Math.sin(angleRad) * blastDistance; 
                const endRotation = Math.random() * 720 - 360;

                piece.style.setProperty('--x2', `${endX}px`);
                piece.style.setProperty('--y2', `${endY}px`);
                piece.style.setProperty('--r2', `${endRotation}deg`);

                const duration = Math.random() * 0.6 + 0.8; 
                piece.style.animationDuration = `${duration}s`;

                document.body.appendChild(piece);

                setTimeout(() => {
                    piece.remove();
                }, duration * 1000);
            }
        }

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playSynthSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(650, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }

        // --- CLICK LISTENERS ---
        document.getElementById('btn1').addEventListener('click', function() {
            playPopSound();
            explodeConfetti(this, 80); 
        });

        document.getElementById('btn2').addEventListener('click', function() {
            playSynthSound();
            explodeConfetti(this, 80); 
        });
    </script>

</body>
</html>
