<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Confetti Explosion</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #191919;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 40px; /* Increased gap to give explosions breathing room */
            z-index: 100;
        }

        button {
            padding: 18px 36px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            position: relative;
        }

        button:active {
            transform: scale(0.95);
        }

        #btn1 { background: linear-gradient(45deg, #ff4757, #ffa502); }
        #btn1:hover { filter: brightness(1.15); }
        #btn2 { background: linear-gradient(45deg, #2ed573, #1e90ff); }
        #btn2:hover { filter: brightness(1.15); }

        /* Confetti pieces shooting outward */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 50; /* Sits completely behind the buttons */
            will-change: transform, opacity;
            animation: explode linear forwards;
        }

        @keyframes explode {
            0% {
                transform: translate3d(0, 0, 0) scale(0.3) rotate3d(1, 1, 1, 0deg);
                opacity: 1;
            }
            70% {
                opacity: 1; /* Stay fully visible during the peak blast */
            }
            100% {
                /* Moves to the random destination angles calculated in JavaScript */
                transform: translate3d(var(--x2), var(--y2), 0) scale(1) rotate3d(1, 1, 1, var(--r2));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="btn1">Pop Blast!</button>
        <button id="btn2">Synth Burst!</button>
    </div>

    <script>
        const rainbowColors = ['#ff4757', '#ffa502', '#eccc68', '#2ed573', '#1e90ff', '#70a1ff', '#9b59b6'];

        function explodeConfetti(buttonElement, count) {
            const rect = buttonElement.getBoundingClientRect();
            
            // Find the perfect center point of the clicked button
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';

                // Large ribbon size variations
                const width = Math.random() * 12 + 16;
                const height = Math.random() * 20 + 26;
                piece.style.width = `${width}px`;
                piece.style.height = `${height}px`;
                piece.style.backgroundColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];

                // Center the piece initial position right behind the button's core
                piece.style.left = `${centerX - width / 2}px`;
                piece.style.top = `${centerY - height / 2}px`;

                // Calculate a true 360-degree radial blast ring
                const angleRad = (i * (360 / count) + (Math.random() * 15 - 7.5)) * (Math.PI / 180);
                
                // Exploding force distance
                const blastDistance = Math.random() * 250 + 150; 
                
                // Calculate absolute X and Y vector trajectories
                const endX = Math.cos(angleRad) * blastDistance;
                const endY = Math.sin(angleRad) * blastDistance; // Balanced Y for a true circular ring burst
                const endRotation = Math.random() * 720 - 360;

                // Send layout vectors to the keyframe animation
                piece.style.setProperty('--x2', `${endX}px`);
                piece.style.setProperty('--y2', `${endY}px`);
                piece.style.setProperty('--r2', `${endRotation}deg`);

                // Speed variation
                const duration = Math.random() * 0.6 + 0.8; // Quick, energetic explosion
                piece.style.animationDuration = `${duration}s`;

                document.body.appendChild(piece);

                // Clear memory
                setTimeout(() => {
                    piece.remove();
                }, duration * 1000);
            }
        }

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playSynthSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(650, audioCtx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.18);
        }

        // --- CLICK LISTENERS ---
        document.getElementById('btn1').addEventListener('click', function() {
            playPopSound();
            explodeConfetti(this, 80); // Fires 80 pieces all around the button
        });

        document.getElementById('btn2').addEventListener('click', function() {
            playSynthSound();
            explodeConfetti(this, 80); // Fires 80 pieces all around the button
        });
    </script>

</body>
</html>
