<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Confetti Buttons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Rainbow styled buttons */
        #btn1 { background: linear-gradient(45deg, #ff4757, #ffa502); }
        #btn1:hover { filter: brightness(1.1); }
        #btn2 { background: linear-gradient(45deg, #2ed573, #1e90ff); }
        #btn2:hover { filter: brightness(1.1); }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="btn1">Pop Blast!</button>
        <button id="btn2">Synth Burst!</button>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        // Vivid rainbow palette
        const rainbowColors = ['#ff4757', '#ffa502', '#eccc68', '#2ed573', '#1e90ff', '#70a1ff', '#9b59b6'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, angle, spread) {
                this.x = x;
                this.y = y;
                const speed = Math.random() * 18 + 7; // Faster speed for larger pieces
                const radAngle = (angle + (Math.random() * spread - spread / 2)) * (Math.PI / 180);
                this.vx = Math.cos(radAngle) * speed;
                this.vy = -Math.sin(radAngle) * speed;
                this.color = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];
                
                // Made confetti significantly larger (Width: 15-27px, Height: 25-45px)
                this.width = Math.random() * 12 + 15;
                this.height = Math.random() * 20 + 25;
                
                this.gravity = 0.35;
                this.alpha = 1;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 8 - 4;
            }
            update() {
                this.x += this.vx;
                this.vy += this.gravity;
                this.y += this.vy;
                this.alpha -= 0.012; // Slower fade so they stay on screen longer
                this.rotation += this.rotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                // Drawing large rectangular ribbons
                ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
                ctx.restore();
            }
        }

        function spawnConfetti(count, x, y, angle, spread) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, angle, spread));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSynthSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- BUTTON EVENTS ---
        document.getElementById('btn1').addEventListener('click', () => {
            playPopSound();
            spawnConfetti(120, window.innerWidth / 2, window.innerHeight * 0.7, 90, 75);
        });

        document.getElementById('btn2').addEventListener('click', () => {
            playSynthSound();
            spawnConfetti(60, 0, window.innerHeight * 0.8, 45, 45);
            spawnConfetti(60, window.innerWidth, window.innerHeight * 0.8, 135, 45);
        });
    </script>

</body>
</html>
