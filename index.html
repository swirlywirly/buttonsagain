<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Confetti Buttons</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #191919; /* Updated dark background */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Rainbow styled buttons */
        #btn1 { background: linear-gradient(45deg, #ff4757, #ffa502); }
        #btn1:hover { filter: brightness(1.1); }
        #btn2 { background: linear-gradient(45deg, #2ed573, #1e90ff); }
        #btn2:hover { filter: brightness(1.1); }

        /* The individual confetti items */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            will-change: transform, opacity; /* Forces Chrome to use smooth hardware acceleration */
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translate3d(var(--x2), var(--y2), 0) rotate3d(1, 1, 1, var(--r2));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="btn1">Pop Blast!</button>
        <button id="btn2">Synth Burst!</button>
    </div>

    <script>
        const rainbowColors = ['#ff4757', '#ffa502', '#eccc68', '#2ed573', '#1e90ff', '#70a1ff', '#9b59b6'];

        function spawnConfetti(count, startX, startY, baseAngle, spread) {
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';

                // Size metrics (Large festival style ribbons)
                const width = Math.random() * 12 + 15;
                const height = Math.random() * 20 + 25;
                piece.style.width = `${width}px`;
                piece.style.height = `${height}px`;
                
                // Color assignment
                piece.style.backgroundColor = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];

                // Set starting position
                piece.style.left = `${startX}px`;
                piece.style.top = `${startY}px`;

                // Physics angles and distance calculations
                const angleRad = (baseAngle + (Math.random() * spread - spread / 2)) * (Math.PI / 180);
                const distance = Math.random() * 400 + 200; // Throw velocity distance
                
                // End trajectory positions
                const endX = Math.cos(angleRad) * distance;
                const endY = -Math.sin(angleRad) * distance + 500; // Gravity simulation pull downward
                const endRotation = Math.random() * 720 + 360;

                // Pass custom CSS variables directly into the keyframe animation
                piece.style.setProperty('--x2', `${endX}px`);
                piece.style.setProperty('--y2', `${endY}px`);
                piece.style.setProperty('--r2', `${endRotation}deg`);

                // Set random rotation starting angle
                piece.style.transform = `rotate3d(1, 1, 1, ${Math.random() * 360}deg)`;

                // Dynamic durations so they fall at natural, variable speeds
                const duration = Math.random() * 1.5 + 1.5;
                piece.style.animationDuration = `${duration}s`;

                document.body.appendChild(piece);

                // Auto-cleanup node memory after the element completes its animation sequence
                setTimeout(() => {
                    piece.remove();
                }, duration * 1000);
            }
        }

        // --- AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playPopSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSynthSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- TRIGGER BUTTON ACTIONS ---
        document.getElementById('btn1').addEventListener('click', () => {
            playPopSound();
            // Center bottom blast launching upward (90 degrees)
            spawnConfetti(70, window.innerWidth / 2, window.innerHeight * 0.7, 90, 60);
        });

        document.getElementById('btn2').addEventListener('click', () => {
            playSynthSound();
            // Left corner shooting diagonally up-right
            spawnConfetti(35, 20, window.innerHeight * 0.8, 45, 30);
            // Right corner shooting diagonally up-left
            spawnConfetti(35, window.innerWidth - 40, window.innerHeight * 0.8, 135, 30);
        });
    </script>

</body>
</html>
