<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Confetti Explosion</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #191919;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 120px;
            z-index: 100;
        }

        button {
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #191919;
            background-color: #ffffff;
            cursor: pointer;
            position: relative;
            font-family: "Times New Roman", Times, serif; 
            
            border: 4px solid #ffffff;
            border-radius: 50px;
            box-shadow: 
                0 8px 0 #dcdcdc,
                0 15px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s, background-color 0.1s, box-shadow 0.1s, border-color 0.1s;
            transform: translateY(0px);
        }

        button:active {
            transform: translateY(6px) scale(0.98);
            box-sizing: border-box;
            box-shadow: 
                0 2px 0 #dcdcdc, 
                0 5px 10px rgba(0,0,0,0.5);
        }

        button:hover {
            background-color: #f7f7f7;
            border-color: #f7f7f7;
        }

        /* Confetti pieces shooting outward */
        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            will-change: transform, opacity;
            animation: explode linear forwards;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes explode {
            0% {
                transform: translate3d(0, 0, 0) scale(0.2) rotate3d(1, 1, 1, 0deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate3d(var(--x2), var(--y2), 0) scale(1) rotate3d(1, 1, 1, var(--r2));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="btn1">Procrastinating ᶻ 𝗓 𐰁</button>
        <button id="btn2">Locked In .ᐟ.ᐟ</button>
    </div>

    <script>
        const greenColors = [
            '#2ed573', // Bright Lime Green
            '#7bed9f', // Soft Light Green
            '#1dd1a1', // Minty Light Green
            '#10ac84', // Deep Emerald Green
            '#05441a', // Forest Dark Green
            '#0f6b2d'  // Mid Dark Green
        ];

        const shapes = [
            { type: 'ribbon', clip: 'none' }, 
            { type: 'star', clip: 'polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)' },
            { type: 'heart', clip: 'path("M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z")' },
            { type: 'flower', clip: 'polygon(50% 0%, 65% 15%, 85% 15%, 85% 35%, 100% 50%, 85% 65%, 85% 85%, 65% 85%, 50% 100%, 35% 85%, 15% 85%, 15% 65%, 0% 50%, 15% 35%, 15% 15%, 35% 15%)' }
        ];

        function explodeConfetti(buttonElement, count) {
            const rect = buttonElement.getBoundingClientRect();
            
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';

                const sizeMatrix = Math.random();
                let baseDimension = 20; 
                
                if (sizeMatrix < 0.3) {
                    baseDimension = Math.random() * 6 + 10;  
                } else if (sizeMatrix < 0.85) {
                    baseDimension = Math.random() * 10 + 20; 
                } else {
                    baseDimension = Math.random() * 12 + 32; 
                }

                const width = baseDimension;
                const shapeProfile = shapes[Math.floor(Math.random() * shapes.length)];
                const height = (shapeProfile.type === 'ribbon') ? baseDimension * (Math.random() * 0.6 + 1.2) : baseDimension;

                piece.style.width = `${width}px`;
                piece.style.height = `${height}px`;
                
                const pieceColor = greenColors[Math.floor(Math.random() * greenColors.length)];
                piece.style.backgroundColor = pieceColor;

                if (shapeProfile.type === 'heart') {
                    piece.style.backgroundColor = 'transparent';
                    piece.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="${shapeProfile.clip}" fill="${pieceColor}"/></svg>`;
                } else if (shapeProfile.clip !== 'none') {
                    piece.style.clipPath = shapeProfile.clip;
                }

                piece.style.left = `${centerX - width / 2}px`;
                piece.style.top = `${centerY - height / 2}px`;

                const angleRad = (i * (360 / count) + (Math.random() * 15 - 7.5)) * (Math.PI / 180);
                
                const speedModifier = baseDimension > 30 ? 1.3 : (baseDimension < 16 ? 0.8 : 1.0);
                const blastDistance = (Math.random() * 260 + 140) * speedModifier; 
                
                const endX = Math.cos(angleRad) * blastDistance;
                const endY = Math.sin(angleRad) * blastDistance; 
                const endRotation = Math.random() * 900 - 450; 

                piece.style.setProperty('--x2', `${endX}px`);
                piece.style.setProperty('--y2', `${endY}px`);
                piece.style.setProperty('--r2', `${endRotation}deg`);

                const duration = (Math.random() * 0.5 + 0.6) * (baseDimension > 30 ? 1.4 : 1.0); 
                piece.style.animationDuration = `${duration}s`;

                document.body.appendChild(piece);

                setTimeout(() => {
                    piece.remove();
                }, duration * 1000);
            }
        }

        // --- RETRO VIDEO GAME SPARKLE AUDIO ENGINE ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Helper to generate a single glittering 8-bit chip note
        function playSparkleNote(delay, pitch) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Triangle wave provides that soft, cute, retro Nintendo/Kirby synth sound
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime + delay);
            
            // Gentle frequency sweep upwards to make each individual note feel extra bouncy
            osc.frequency.exponentialRampToValueAtTime(pitch * 1.2, audioCtx.currentTime + delay + 0.06);
            
            // Quick 8-bit style decay volume profile
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.08);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(audioCtx.currentTime + delay);
            osc.stop(audioCtx.currentTime + delay + 0.08);
        }

        // Button 1: Soft magical, low-to-high video game item find chime
        function playButton1Sparkle() {
            initAudio();
            playSparkleNote(0.00, 783.99);  // G5
            playSparkleNote(0.03, 987.77);  // B5
            playSparkleNote(0.06, 1174.66); // D6
            playSparkleNote(0.09, 1567.98); // G6 (High twinkle)
        }

        // Button 2: Bright, crystalline cascading fairy-dust sparkle cluster
        function playButton2Sparkle() {
            initAudio();
            playSparkleNote(0.00, 1046.50); // C6
            playSparkleNote(0.02, 1318.51); // E6
            playSparkleNote(0.04, 1567.98); // G6
            playSparkleNote(0.06, 1975.53); // B6
            playSparkleNote(0.08, 2093.00); // C7 (Ultra high crystal sparkle)
        }

        // --- CLICK LISTENERS ---
        document.getElementById('btn1').addEventListener('click', function() {
            playButton1Sparkle();
            explodeConfetti(this, 95); 
        });

        document.getElementById('btn2').addEventListener('click', function() {
            playButton2Sparkle();
            explodeConfetti(this, 95); 
        });
    </script>

</body>
</html>
